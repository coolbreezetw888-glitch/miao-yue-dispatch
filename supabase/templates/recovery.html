<!DOCTYPE html>
<html lang="zh-Hant">
  <body style="margin:0; padding:0; background-color:#f5f5f4; font-family:'Helvetica Neue', Arial, 'PingFang TC', 'Microsoft JhengHei', sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f4; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:12px; overflow:hidden;">
            <tr>
              <td style="padding:32px 28px;">
                <h1 style="margin:0 0 16px; font-size:20px; color:#1c1917;">重設你的「秒約」登入密碼</h1>
                <p style="margin:0 0 24px; font-size:15px; line-height:1.7; color:#44403c;">
                  我們收到一個重設你秒約登入密碼的請求。請點下方按鈕設定新密碼。
                </p>
                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px;">
                  <tr>
                    <td style="border-radius:8px; background-color:#0f766e;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block; padding:12px 28px; font-size:15px; font-weight:600; color:#ffffff; text-decoration:none;">
                        重設密碼
                      </a>
                    </td>
                  </tr>
                </table>
                <p style="margin:0 0 8px; font-size:13px; line-height:1.6; color:#a8a29e;">
                  這個連結有時效性,如果連結已經失效,請回到登入頁重新申請。
                </p>
                <p style="margin:0; font-size:13px; line-height:1.6; color:#a8a29e;">
                  如果不是你本人的操作,請忽略這封信,密碼不會被更改。
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
